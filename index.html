<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیام‌رسان من</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #fff; padding: 10px 15px; border-radius: 10px; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); align-self: flex-start; }
        .msg.mine { background: #dcf8c6; align-self: flex-end; }
        .sender { font-size: 12px; color: #666; margin-bottom: 5px; }
        .input-area { display: flex; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-family: inherit; }
        button { padding: 10px 20px; margin-right: 10px; background: #00a884; color: white; border: none; border-radius: 20px; cursor: pointer; font-family: inherit; }
        #nameInput { margin-bottom: 5px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="messages"></div>
    
    <div style="padding: 10px; background: #fff;">
        <input id="nameInput" type="text" placeholder="اسم شما..." style="width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 10px; margin-bottom: 10px;">
        <div class="input-area" style="border: none; padding: 0;">
            <input id="messageInput" type="text" placeholder="پیام خود را بنویسید...">
            <button onclick="sendMessage()">ارسال</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://aghrbjaulyosklixbqay.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1TZlR_VH6E_XfhjfOr99NA_YEarn0al';

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const room = 'public-chat';
        const messagesDiv = document.getElementById('messages');

        function displayMessage(msg) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            
            const name = msg.sender;
            const myName = document.getElementById('nameInput').value;
            if (myName && name === myName) {
                msgDiv.classList.add('mine');
            }

            msgDiv.innerHTML = `<div class="sender">${name}</div><div>${msg.content}</div>`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function loadMessages() {
            const { data, error } = await db
                .from('messages')
                .select('*')
                .eq('room', room)
                .order('created_at', { ascending: true });
            
            if (data) {
                messagesDiv.innerHTML = '';
                data.forEach(displayMessage);
            }
        }

        async function sendMessage() {
            const nameInput = document.getElementById('nameInput');
            const msgInput = document.getElementById('messageInput');
            const sender = nameInput.value.trim() || 'ناشناس';
            const content = msgInput.value.trim();

            if (!content) return;

            msgInput.value = ''; 

            const { error } = await db
                .from('messages')
                .insert([{ room: room, sender: sender, content: content }]);
            
            if (error) alert('خطا در ارسال: ' + error.message);
        }

        db.channel('custom-channel')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room=eq.${room}` }, payload => {
                displayMessage(payload.new);
            })
            .subscribe();

        loadMessages();
    </script>
</body>
</html>
